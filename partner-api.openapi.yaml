        `POST /partner-bridge/bookings`: same grant, same required
        `Idempotency-Key`, same request body, same responses, same status codes.

        It is documented because it is real and was proven live on 2026-08-15 —
        a genuine second booking was created through a request carrying no
        trailing segment — and because a client or proxy that strips a trailing
        path will hit it by accident rather than by intent.

