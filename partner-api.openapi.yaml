        method**, so `GET /partner-bridge` returns the same page, with the same
        grant, the same filters and cursor, and the same object shape as
        `GET /partner-bridge/bookings`.

        **This operation was added by the Phase 4a drift guard**, which compared
        the dispatch against this document and found the `GET` half of the alias
        served by the code but undeclared here — the first drift the guard
        caught, on its first run, against a spec written the day before.

        **Prefer `GET /bookings`.** Every response, example and error branch is
        specified there and is not repeated here.
      x-grant-key: bookings.list
