              example: { ok: false, reason: "not_found" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /cancel:
    post:
      tags: [Lifecycle]
      operationId: cancelBooking
      summary: Cancel a booking
      description: |
        No-refund cancel of a booking this key created. The lockers are released
        immediately.

        **Cancelling does not reverse commission.** The commission accrued when
        the booking was created stays accrued.

        Only a `pending` or `active` booking can be cancelled; anything else is
        `invalid_state`.
      x-grant-key: booking.cancel
      x-idempotency-key: not-read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceRequest" }
            example: { reference: "CL-EXAMPLE-0001" }
      responses:
        "200":
          description: The booking is cancelled.
          x-observed: live 2026-08-15
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelOk" }
              examples:
                observed:
                  summary: Live capture, sanitised
                  value: { ok: true, reference: "CL-EXAMPLE-0001", status: "cancelled" }
        "400":
          description: >-
            `invalid` — malformed JSON body, or `reference` missing or blank.
            Reachable only after authentication on this route: the key is
            verified before the body is read.
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorInvalid" }
              example: { ok: false, reason: "invalid", error: "reference is required." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/LifecycleForbidden" }
        "404":
          description: "`not_found` — no such booking for this partner."
          x-observed: not observed live on this endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorNotFound" }
              example: { ok: false, reason: "not_found" }
        "409":
          description: >-
            `invalid_state` — the booking is neither `pending` nor `active`; it
            has already been cancelled, completed or expired.
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorInvalidState" }
              example: { ok: false, reason: "invalid_state" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /end:
    post:
      tags: [Lifecycle]
      operationId: endBooking
      summary: End a booking
      description: |
        Force-end a booking this key created. The lockers are released and the
        booking becomes `completed`.

        **Ending EARLY is allowed.** A live booking can be ended at any point
        before its window closes and it completes immediately — proven live on
        2026-08-15 against a booking with more than seven hours left to run.

        There is no `window_not_expired` refusal on this endpoint. The
        window-expiry guard was deleted in migration
        `20260728140000_end_booking_early.sql`; the reason string survives in the
        platform's shared status map only because removing it would have been
        needless churn, and no live code path returns it through this route. It
        is therefore **not listed as a response here**, and a source comment in
        the edge function still describing that guard is stale.

        Only a `pending` or `active` booking can be ended; anything else is
        `invalid_state`.
      x-grant-key: booking.end
      x-idempotency-key: not-read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceRequest" }
            example: { reference: "CL-EXAMPLE-0002" }
      responses:
        "200":
          description: The booking is completed.
          x-observed: live 2026-08-15 (ended early, before the window closed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EndOk" }
              examples:
                observed:
                  summary: Live capture, sanitised — an 8-hour booking ended minutes in
                  value: { ok: true, reference: "CL-EXAMPLE-0002", status: "completed" }
        "400":
          description: >-
            `invalid` — malformed JSON body, or `reference` missing or blank.
            Post-authentication only.
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorInvalid" }
              example: { ok: false, reason: "invalid", error: "reference is required." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/LifecycleForbidden" }
        "404":
          description: "`not_found` — no such booking for this partner."
          x-observed: not observed live on this endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorNotFound" }
              example: { ok: false, reason: "not_found" }
        "409":
          description: >-
            `invalid_state` — the booking is neither `pending` nor `active`.
            This is the ONLY 409 this endpoint can return.
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorInvalidState" }
              example: { ok: false, reason: "invalid_state" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /extend:
    post:
      tags: [Lifecycle]
      operationId: extendBooking
      summary: Extend a booking
      description: |
        Push the end of a booking this key created. The added block is priced
        through the same tier engine as create and **charged for real**;
        settlement follows the partner's collection mode exactly as create does.

        **`Idempotency-Key` is REQUIRED on this endpoint**, because it moves
        money. A retry with the same key returns the original outcome and never
        charges twice. Earlier written accounts of this API described the header
        as create-only; that was wrong.

        **A REFUSED EXTEND SPENDS THE KEY. Retry a corrected duration under a NEW
        key.** The key is claimed before `extend_minutes` is validated, so a
        refusal is recorded against it as that key's final outcome. Re-sending
        the same key with a duration that *would* price returns the original
        `400 invalid_duration` unchanged — the new duration is never looked at.
        Observed live 2026-08-18: key K at 90 minutes → `400 invalid_duration`;
        K again at 480 minutes → `400 invalid_duration`, byte-identical; a fresh
        key at 480 minutes → `200`, extended and charged. The refusal body
        carries **no `replayed` field**, so the replay is not visible in the
        response. **Fixed in 0.215.0:** a replayed refusal now carries
        `replayed: true` as well, so a cached rejection is distinguishable from a
        fresh one. See the `Error` schema for the exact guarantee — the field is
        optional and is never synthesised.

        **Each extension accrues its own commission entry.** An extension does
        not amend the booking's original accrual, it adds a second one.

        `extend_minutes` must be an integer of at least **180** (3 hours) and at
        most 365 days; the resulting end must also stay within 366 days of now.
        A duration of 180 or more that the pricing engine still cannot sell for
        this size (not a chip duration or whole days) is refused the same way —
        `400 invalid_duration` — not a 500. See the `400` response below for the
        full refusal range.

        Fixed 2026-08-16 (previously this range 500'd; see CHANGELOG). The value
        to send is a duration the size actually prices — read them from the
        price model, and prefer whole days or the size's chip durations.
      x-grant-key: booking.extend
      x-idempotency-key: required
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtendRequest" }
            example: { reference: "CL-EXAMPLE-0001", extend_minutes: 480 }
      responses:
        "200":
          description: |
            The extension was applied, or an earlier identical request's outcome
            is being replayed.

            `end` is the booking's new end. `extension_charge` is what this
            extension cost; `total` is the booking's new cumulative total.
            `status` is the booking's status as it was when the extension was
            accepted.

            On `replayed: true` this is the **stored result of the original
            extension**, stamped as replayed — unlike a create replay, which
            re-reads live state.
          x-observed: live 2026-08-15
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtendOk" }
              examples:
                observed:
                  summary: Live capture, sanitised — 8 more hours on a 9 AED booking
                  value:
                    ok: true
                    replayed: false
                    reference: "CL-EXAMPLE-0001"
                    status: "active"
                    end: "2026-08-16T11:32:21Z"
                    extension_charge: 9
                    currency: "AED"
                    total: 18
        "400":
          description: |
            * `invalid` — missing/blank `Idempotency-Key` (checked before the
              body is read, but after the key is verified), malformed JSON body,
              missing `reference`, or `extend_minutes` absent, non-integer or
              below 1 (edge-level shape check).
            * `invalid_duration` — `extend_minutes` **below 180** (the 3-hour
              floor), above 365 days, a new end beyond 366 days from now, or a
              duration of 180 or more that the pricing engine cannot sell for
              this size (not a chip duration or whole days for it). All four
              cases return this same clean `400`, never a 500.
          x-observed: "invalid_duration observed live 2026-08-16 at extend_minutes 1 and 59 (the pre-existing range); container-proven 2026-08-16 at 60, 90, 179, 181 and 200 (the fixed range)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorExtendBadRequest" }
              examples:
                missing_idempotency_key:
                  value: { ok: false, reason: "invalid", error: "Idempotency-Key header is required." }
                invalid_duration:
                  value: { ok: false, reason: "invalid_duration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/LifecycleForbidden" }
        "404":
          description: "`not_found` — no such booking for this partner."
          x-observed: not observed live on this endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorNotFound" }
              example: { ok: false, reason: "not_found" }
        "409":
          description: |
            * `invalid_state` — the booking is neither `pending` nor `active`, or
              it has no live locker holds left to push.
            * `in_progress` — this Idempotency-Key is currently in flight on
              another request.
            * `unavailable` — a compartment the booking holds is already booked
              by someone else for the extended window, so the extension cannot
              be applied.
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorExtendConflict" }
              examples:
                invalid_state:
                  value: { ok: false, reason: "invalid_state" }
                unavailable:
                  value: { ok: false, reason: "unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /resend-code:
    post:
      tags: [Access codes]
      operationId: resendAccessCode
      summary: Re-fetch the access code
      description: |
        Return the existing access code for a live booking this key created. It
        is a pure read: the code is not changed, and **nothing is sent to the
        customer** — no email, no SMS, no push. Despite the name, delivering the
        code is the partner's job.

        Refused with `invalid_state` when the booking is not `pending` or
        `active`, when the location is a **beach** location (the passcode there
        is customer-set, not ours to hand out), or when no code exists yet
        (a `we_collect` booking awaiting settlement). A successful response
        therefore always carries a real code — never `null`.
      x-grant-key: booking.resend_code
      x-idempotency-key: not-read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceRequest" }
            example: { reference: "CL-EXAMPLE-0001" }
      responses:
        "200":
          description: The booking's current access code.
          x-observed: live 2026-08-15
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessCodeOk" }
              examples:
                observed:
                  summary: >-
                    Live capture, sanitised. The real code was a 6-digit string;
                    `000000` here is a placeholder, not a code that works.
                  value:
                    ok: true
                    reference: "CL-EXAMPLE-0001"
                    status: "active"
                    access_code: "000000"
        "400":
          description: "`invalid` — malformed JSON body, or `reference` missing or blank."
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorInvalid" }
              example: { ok: false, reason: "invalid", error: "reference is required." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/LifecycleForbidden" }
        "404":
          description: "`not_found` — no such booking for this partner."
          x-observed: not observed live on this endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorNotFound" }
              example: { ok: false, reason: "not_found" }
        "409":
          description: >-
            `invalid_state` — the booking is not live, or it is at a beach
            location, or it has no access code yet. The three branches are not
            distinguishable from the response.
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorInvalidState" }
              example: { ok: false, reason: "invalid_state" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /reissue-code:
    post:
      tags: [Access codes]
      operationId: reissueAccessCode
      summary: Revoke and re-mint the access code
      description: |
        Delete the current access code of a live booking this key created and
        mint a fresh one. This is a real write. **Nothing is sent to the
        customer** — the new code comes back in the response and delivering it is
        the partner's job.

        **The physical keypad keeps honouring the OLD code until the device event
        pipeline catches up.** Reissuing enqueues a `booking.updated` event; the
        wall learns the new code when that event is consumed, not at the moment
        of the API call. Plan for a short window in which both codes are, in
        practice, live at the door.

        Same refusals as `resend-code`: not live, beach location, or no existing
        code → `invalid_state`.
      x-grant-key: booking.reissue_code
      x-idempotency-key: not-read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceRequest" }
            example: { reference: "CL-EXAMPLE-0001" }
      responses:
        "200":
          description: The newly minted access code. The previous code is gone.
          x-observed: live 2026-08-15
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessCodeOk" }
              examples:
                observed:
                  summary: >-
                    Live capture, sanitised. The real value differed from the
                    code the same booking's `resend-code` had just returned,
                    confirming the rotation.
                  value:
                    ok: true
                    reference: "CL-EXAMPLE-0001"
                    status: "active"
                    access_code: "000000"
        "400":
          description: "`invalid` — malformed JSON body, or `reference` missing or blank."
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorInvalid" }
              example: { ok: false, reason: "invalid", error: "reference is required." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/LifecycleForbidden" }
        "404":
          description: "`not_found` — no such booking for this partner."
          x-observed: not observed live on this endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorNotFound" }
              example: { ok: false, reason: "not_found" }
        "409":
          description: >-
            `invalid_state` — the booking is not live, or it is at a beach
            location, or it has no code to replace.
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorInvalidState" }
              example: { ok: false, reason: "invalid_state" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    partnerApiKey:
      type: http
      scheme: bearer
      bearerFormat: kpk_<mode>_<8hex>_<64hex>
      description: |
        `Authorization: Bearer kpk_live_1a2b3c4d_<64 hex characters>`

        Four underscore-separated segments:

        | segment | example | secret? |
        |---|---|---|
        | literal | `kpk` | no |
        | mode | `live` or `test` | no |
        | key id | `1a2b3c4d` (8 hex) | no |
        | secret | 64 hex characters | **yes** |

        The first three segments are the key's **prefix** and are safe to log,
        quote and store. The fourth is the secret and appears nowhere except the
        `Authorization` header — the server keeps only a SHA-256 hash of the
        whole key.

        **Mode** is a property of the key, not of the request. `live` keys
        operate on your real scoped locations and accrue commission; `test` keys
        (0.268.0) are scoped to a shared fixture location, stamp their bookings
        `booking_type = 'test'` and accrue no commission — on the same host,
        through the same endpoints. Read the mode of the key you hold from
        `GET /bootstrap`'s `mode` field rather than parsing the string yourself,
        and treat the two hosts under `servers` as separate worlds: a key issued
        on one never authenticates on the other.

        Legacy three-segment keys (`kpk_<8hex>_<64hex>`, no mode) no longer
        authenticate at all and are rejected as `unauthorized`.

  parameters:
    BookingsStatus:
      name: status
      in: query
      required: false
      description: Only bookings in exactly this lifecycle state.
      schema: { $ref: "#/components/schemas/BookingStatus" }
      # An explicit example, because the Postman converter otherwise picks a RANDOM enum member
      # per run and the generated collection stops being deterministic (spec:postman refuses).
      example: active
    BookingsMode:
      name: mode
      in: query
      required: false
      description: >-
        `test` — only bookings stamped `booking_type: test` (made with a test key, or by a
        tester customer). `live` — everything else. Omit for both.
      schema: { type: string, enum: [test, live] }
      example: test
    BookingsLimit:
      name: limit
      in: query
      required: false
      description: Page size, 1–100. Default 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      example: 50
    BookingsCursor:
      name: cursor
      in: query
      required: false
      description: >-
        The `next_cursor` of the previous page, verbatim. Opaque; a value that does not
        decode is refused `400 invalid`.
      schema: { type: string }
      example: MjAyNi0wOS0wNiAxMDowMDowMCswMHxlMjY5MDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMDA=
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A caller-chosen key that makes this request replay-safe. Required on
        create and extend, the two operations that move money. Reuse the same
        value to retry the same logical request; use a new value for a genuinely
        new one. Missing or blank is `400 invalid`. A UUID is a good choice.

        **A KEY IS SPENT BY ITS FIRST OUTCOME, INCLUDING A REJECTION — SO A
        CORRECTED RETRY NEEDS A NEW KEY.** The key is claimed before the request
        is validated, and the outcome recorded against it is final. If the first
        request under a key is refused, the refusal is what that key now
        returns: sending a **corrected** request under the same key replays the
        original rejection and the correction is never evaluated. This is not a
        same-payload rule — the request body is not compared, and changing it
        changes nothing.

        Concretely, observed live on `POST /extend` (2026-08-18): a key sent with
        an unpriceable `extend_minutes` returned `400 invalid_duration`; the same
        key re-sent with a **priceable** duration returned `400
        invalid_duration` again, byte-identical; the same corrected request under
        a **fresh** key returned `200` and extended the booking.

        **Use a new key whenever you change the request.** Reuse a key only to
        retry a request you have not altered — a timeout, a dropped connection,
        an unknown outcome. Note also that a replayed **rejection** is not
        flagged: unlike a replayed success, an error body carries no `replayed`
        field, so a cached refusal is indistinguishable from a fresh one. If you
        need to know which you got, track key reuse on your side.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        examples: ["9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"]

  responses:
    Unauthorized:
      description: |
        `unauthorized` at **401**, from this route's own key-verification step.
        Three branches share it: no `Authorization: Bearer` header at all, a key
        that matches no active key row, and a key whose partner is not active.

        Note the distinct 403 flavour of the same reason string documented on
        create and the lifecycle operations — see the API description.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorUnauthorized" }
          examples:
            bad_key:
              summary: Live capture — a key that matches nothing
              value: { ok: false, reason: "unauthorized", error: "Unauthorized." }
            no_key:
              summary: Live capture — no bearer token supplied
              value: { ok: false, reason: "unauthorized", error: "Missing bearer API key." }
    RateLimited:
      description: >-
        `rate_limited` — more than 60 requests in a minute from this key prefix.
        The limiter is per function instance and resets on cold start, so the
        real ceiling varies. Back off and retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorRateLimited" }
          example: { ok: false, reason: "rate_limited", error: "Rate limit exceeded." }
    ServerError:
      description: >-
        `server_error` — the function could not reach the database, could not
        verify the key, or the underlying procedure failed. Never a raw stack
        trace and never an unstructured 500 body. Retrying is reasonable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorServerError" }
          example: { ok: false, reason: "server_error", error: "Verification failed." }
    LifecycleForbidden:
      description: |
        The lifecycle operations share one 403 set, all produced inside the
        operation's own procedure and mapped by the generic reason→status mapper:

        * `capability` — the partner does not hold the inbound direction.
        * `not_permitted` — the partner is not granted this specific operation.
        * `unauthorized` — **403, not 401**: the partner was found not active by
          the procedure. Reachable only if the partner is deactivated between
          key verification and this read.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorLifecycleForbidden" }
          examples:
            not_permitted:
              value: { ok: false, reason: "not_permitted" }
            capability:
              value: { ok: false, reason: "capability" }
            unauthorized_403:
              summary: The same reason string that means 401 elsewhere
              value: { ok: false, reason: "unauthorized" }

  schemas:
    # ── shared primitives ────────────────────────────────────────────────────
    BookingReference:
      type: string
      minLength: 1
      description: >-
        The partner's handle on a booking, allocated at creation and stable for
        its lifetime. Treat it as an opaque string; do not parse it and do not
        assume a numbering scheme.
      examples: ["CL-EXAMPLE-0001"]
    Currency:
      type: string
      description: ISO-4217 currency code of the price model that priced the booking.
      examples: ["AED"]
    Money:
      type: number
      minimum: 0
      description: >-
        An amount in the major unit of `currency`, rounded to the currency's
        minor unit. Serialised as a JSON number.
    Instant:
      type: string
      format: date-time
      description: An ISO-8601 instant in UTC.
      examples: ["2026-08-15T19:32:20Z"]
    BookingStatus:
      type: string
      description: |
        Lifecycle state of a booking.

        * `pending` — created, awaiting payment (a `we_collect` partner). No
          access code yet.
        * `active` — paid or settled, the locker is held and usable.
        * `cancelled` — cancelled; the locker is released, no refund.
        * `completed` — ended; the locker is released.
        * `expired` — the window ran out without the booking being closed.
      enum: [pending, active, cancelled, completed, expired]
    AccessCode:
      type: string
      pattern: "^[0-9]{6}$"
      description: >-
        Six decimal digits, generated from a cryptographic RNG. Hand it to the
        end customer; it is what opens the compartment. Never log it.
      examples: ["000000"]
    GrantKey:
      type: string
      description: >-
        An operation key from the partner grant vocabulary. The eleven callable
        values are enumerated here; the three planned-but-unbuilt keys
        (`booking.open`, `booking.add_lockers`, `booking.overstay`) can also
        appear on a partner's grants and are listed under `x-planned-operations`
        at the root of this document — holding one of those grants still gives
        you nothing to call.
      enum:
        - locations
        - availability
        - quote
        - bookings.list
        - booking.read
        - booking.create
        - booking.cancel
        - booking.end
        - booking.extend
        - booking.resend_code
        - booking.reissue_code
        - booking.open
        - booking.add_lockers
        - booking.overstay
    Reason:
      type: string
      description: |
        The complete machine-readable refusal vocabulary. Not every reason is
        reachable on every endpoint — each operation narrows this enum to the
        branches it can actually produce, and the HTTP status a reason maps to is
        documented there rather than globally.

        `window_not_expired` is listed for completeness of the vocabulary and is
        **not reachable through any endpoint in this document**; the guard that
        produced it was deleted and the string survives only in a shared status
        map. It appears in no operation's response.
      enum:
        - unauthorized
        - capability
        - out_of_scope
        - not_permitted
        - not_found
        - unavailable
        - in_progress
        - invalid_state
        - window_not_expired
        - invalid
        - invalid_duration
        - period_not_allowed
        - rate_limited
        - server_error

    # ── envelopes ────────────────────────────────────────────────────────────
    Error:
      type: object
      description: |
        The refusal envelope. `ok` is always `false` and `reason` is always
        present. Branch on `reason`.

        `error` is a human-readable sentence and is present only on branches the
        edge function itself produces; a refusal coming from the underlying
        procedure carries `reason` alone. Its absence carries no meaning, and its
        wording is not part of this contract.

        `replayed` is **optional and not guaranteed**. It appears only on a refusal
        from an operation that consulted an idempotency claim — in practice
        **create and extend**, the two that require `Idempotency-Key` — and only
        when the underlying procedure actually reported it. Where it appears,
        `replayed: true` means this refusal is the **stored outcome of an earlier
        request under the same key**, not a fresh evaluation of the request you
        just sent.

        **It is never synthesised.** A refusal that never reached an idempotency
        claim — a malformed body, a failed key verification, a missing header, or
        any read endpoint — omits the field entirely rather than asserting
        `replayed: false`. Absence therefore means "not answered", not "fresh", so
        do not treat a missing `replayed` as proof that a request was newly
        evaluated.

        Fixed 2026-08-18 (0.215.0). Both routes previously rebuilt the refusal from
        `reason` alone and dropped the flag, so a cached rejection was
        byte-identical to a fresh one. That mattered because **a key is spent by
        its first outcome**: a caller who corrected an unpriceable duration and
        retried under the same key received the original refusal back with nothing
        in the response to say it was a replay. (An earlier revision of this
        document claimed the extend route preserved the flag. It did not — both
        dropped it.)
      required: [ok, reason]
      properties:
        ok:
          type: boolean
          const: false
        reason: { $ref: "#/components/schemas/Reason" }
        error:
          type: string
          description: Human-readable, advisory only. Never branch on it.
        replayed:
          type: boolean
          description: Present when this refusal is a replay of an earlier rejected request.
      additionalProperties: true

    ErrorUnauthorized:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              const: unauthorized
    ErrorNotPermitted:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              const: not_permitted
    ErrorNotFound:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              const: not_found
    ErrorInvalid:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              const: invalid
    ErrorInvalidState:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              const: invalid_state
    ErrorUnavailable:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              const: unavailable
            cause:
              type: string
              enum: [no_capacity, no_price_model, conflict]
              description: >-
                Why (0.285.0), on `POST /bookings` only. `no_capacity` — no
                deployed wall at the location has enough free, in-service,
                bookable compartments of every requested size for the window
                (change the request). `no_price_model` — the resolved wall has
                no price model attached: our configuration gap, not your
                request (contact CityLockers). `conflict` — a concurrent booking
                took the compartment between the availability check and the
                insert (retry). A replay with the same Idempotency-Key repeats
                the original cause. Absent on every other refusal.
    ErrorRateLimited:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              const: rate_limited
    ErrorServerError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              const: server_error
    ErrorScopedForbidden:
      description: 403 on a scoped read — the location, or the grant.
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              enum: [out_of_scope, not_permitted]
    ErrorLifecycleForbidden:
      description: >-
        403 on a lifecycle write. Includes `unauthorized`, which means 403 here
        and 401 on the verification branch — the one-reason-two-statuses case.
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              enum: [capability, not_permitted, unauthorized]
    ErrorCreateForbidden:
      description: 403 on create — capability, scope, grant, or a deactivated partner.
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              enum: [capability, out_of_scope, not_permitted, unauthorized]
    ErrorCreateBadRequest:
      description: >-
        400 on create. The `invalid` branch is reachable UNAUTHENTICATED — the
        body is parsed before the key is verified on this route only.
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              enum: [invalid, invalid_duration, period_not_allowed]
    ErrorCreateConflict:
      description: 409 on create — nothing free, or a replay still in flight.
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              enum: [unavailable, in_progress]
            cause:
              type: string
              enum: [no_capacity, no_price_model, conflict]
              description: >-
                Present with `unavailable` only (0.285.0) — see ErrorUnavailable
                for what each value asks of you.
    ErrorExtendBadRequest:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              enum: [invalid, invalid_duration]
    ErrorExtendConflict:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            reason:
              type: string
              enum: [invalid_state, in_progress, unavailable]

    # ── discovery payloads ───────────────────────────────────────────────────
    GrantedOperation:
      type: object
      description: >-
        One operation the partner is granted. Note this is an OBJECT, not a bare
        string — a client reading `granted_operations` as an array of strings
        will break.
      required: [key, kind, label]
      properties:
        key: { $ref: "#/components/schemas/GrantKey" }
        kind:
          type: string
          enum: [read, write]
          description: Grouping only. It does not affect what the endpoint does.
        label:
          type: string
          description: Human-readable name, for display in your own UI.
      additionalProperties: true
    PeriodPolicy:
      type: object
      description: >-
        What window shapes this partner may book. Enforced on create, and NOT
        re-enforced by `/availability` or `/quote`.
      required: [allow_intraday, allow_multiday, day_minutes, multiday_max_minutes, intraday_durations]
      properties:
        allow_intraday:
          type: boolean
          description: Whether sub-24h windows may be booked.
        allow_multiday:
          type: boolean
          description: Whether windows of whole 24h blocks beyond one day may be booked.
        day_minutes:
          type: integer
          description: Minutes in a booking day. Always 1440.
        multiday_max_minutes:
          type: integer
          description: Ceiling on a multi-day window, in minutes.
        intraday_durations:
          type: array
          description: >-
            The bookable sub-day durations, in minutes, read from the price
            models attached to the deployed walls at your scoped locations —
            the same source the create path prices from (0.282.0). A duration
            is listed when at least one wall in your scope prices at least one
            size at it; pricing is still per wall and per size, so a listed
            duration can be refused for a particular size. **May be empty** —
            an empty array does not mean intraday is forbidden, it means no
            wall in your scope currently prices a sub-day tier. Read
            `allow_intraday` for permission.
          items: { type: integer }
      additionalProperties: true
    LocationSize:
      type: object
      required: [id, name, capacity]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: Size name as configured, e.g. `small`, `medium`, `large`.
        capacity:
          type: integer
          description: >-
            Static count of operational compartments of this size at the
            location. NOT live availability.
      additionalProperties: true
    Location:
      type: object
      required: [id, name, address, lat, lon, sizes, opening_hours]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address:
          type: [string, "null"]
          description: Free-text address. Frequently `null` — do not rely on it.
        lat:
          type: [number, "null"]
          description: Latitude. `null` when the location has not been geocoded.
        lon:
          type: [number, "null"]
          description: Longitude. `null` when the location has not been geocoded.
        sizes:
          type: array
          items: { $ref: "#/components/schemas/LocationSize" }
        opening_hours:
          type: [string, "null"]
          description: >-
            When this location is open, as FREE TEXT — not a structured schedule.
            Do not parse it; show it. Expect shapes like `24/7`,
            `Daily 08:00–22:00` or `Mon–Fri 09:00–18:00, Sat 10:00–16:00`,
            in whatever wording and language the host supplied.


            The value is EFFECTIVE: the location's own hours where it has them,
            otherwise the parent building's, following the same
            null-means-inherit rule the rest of the location content uses.
            `null` means neither is set — the hours are unknown, not "closed".
            Added in v0.263.0; the key is always present.
          example: "24/7"
      additionalProperties: true
    BootstrapOk:
      type: object
      required: [ok, partner_id, period_policy, granted_operations, locations, mode]
      properties:
        ok: { type: boolean, const: true }
        partner_id: { type: string, format: uuid }
        period_policy: { $ref: "#/components/schemas/PeriodPolicy" }
        granted_operations:
          type: array
          items: { $ref: "#/components/schemas/GrantedOperation" }
        locations:
          type: array
          description: >-
            The locations in THIS KEY's scope. A location absent here cannot be
            booked with this key, whatever the partner's other keys can reach.
          items: { $ref: "#/components/schemas/Location" }
        mode:
          type: string
          enum: [live, test]
          description: >-
            The mode of the key that authenticated this request. Added by the
            API gateway from the verified key's own record — the underlying
            procedure does not know which key was presented and never returns
            this field. `test` (0.268.0): the locations listed are fixture
            inventory, bookings are stamped `test` and no commission accrues.
      additionalProperties: true
    AvailabilitySize:
      type: object
      required: [id, name, available]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        available:
          type: integer
          minimum: 0
          description: Compartments of this size free for the whole requested window.
      additionalProperties: true
    AvailabilityOk:
      type: object
      required: [ok, location_id, start, duration_minutes, end, availability]
      properties:
        ok: { type: boolean, const: true }
        location_id: { type: string, format: uuid }
        start:
          allOf: [{ $ref: "#/components/schemas/Instant" }]
          description: The window start actually used — your `start_time`, or now.
        duration_minutes: { type: integer }
        end: { $ref: "#/components/schemas/Instant" }
        availability:
          type: array
          items: { $ref: "#/components/schemas/AvailabilitySize" }
      additionalProperties: true
    QuoteOk:
      type: object
      required: [ok, location_id, locker_size_id, quantity, duration_minutes, per_locker, amount, currency]
      properties:
        ok: { type: boolean, const: true }
        location_id: { type: string, format: uuid }
        locker_size_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        duration_minutes: { type: integer, minimum: 1 }
        per_locker:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Unit price before the multi-locker discount.
        amount:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Total for `quantity` lockers, discount applied.
        currency: { $ref: "#/components/schemas/Currency" }
      additionalProperties: true

    # ── booking payloads ─────────────────────────────────────────────────────
    CreateBookingItem:
      type: object
      required: [locker_size_id, quantity]
      properties:
        locker_size_id:
          type: string
          format: uuid
          description: A size id from `GET /bootstrap`.
        quantity:
          type: integer
          minimum: 1
          description: How many compartments of this size.
      additionalProperties: false
    CreateBookingCustomer:
      type: object
      description: >-
        The end customer. **At least one of `email` and `phone` is required**;
        the customer is resolved by whichever is supplied and a matching existing
        customer is reused. `name` is only written when the customer row is
        created — see the first-write-wins note.
      properties:
        email: { type: string, format: email }
        phone: { type: string }
        name: { type: string }
      anyOf:
        - required: [email]
        - required: [phone]
      additionalProperties: false
    CreateBookingRequest:
      type: object
      description: >-
        Send either `duration_minutes` or `end_time`. `duration_minutes` wins if
        both are present.
      required: [location_id, items, customer]
      properties:
        location_id:
          type: string
          format: uuid
          description: A location in this key's scope.
        items:
          type: array
          minItems: 1
          description: One entry per size wanted. All lockers land on a single wall.
          items: { $ref: "#/components/schemas/CreateBookingItem" }
        start_time:
          type: [string, "null"]
          format: date-time
          description: Window start. Omit or send `null` for now.
        duration_minutes:
          type: integer
          minimum: 180
          description: >-
            Window length. The engine's real floor is 180 minutes even though the
            gateway's shape check admits 60; a value in between is accepted by
            the gateway and then refused as `invalid`. Above 1440 it must be a
            whole multiple of 1440.
        end_time:
          type: string
          format: date-time
          description: >-
            Alternative to `duration_minutes`; the window is derived from this
            against `start_time` (or now) and rounded to whole minutes.
        customer: { $ref: "#/components/schemas/CreateBookingCustomer" }
      additionalProperties: false
    CustomerEcho:
      type: object
      description: >-
        The STORED customer this booking is attached to. If an existing customer
        matched the email or phone you sent, this is that customer's data —
        including a `name` you did not send.
      required: [id, name, email, phone]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
      additionalProperties: true
    CreateBookingOk:
      type: object
      description: >-
        A created — or replayed — booking. On `replayed: true` the state fields
        describe the booking NOW, not what the original create returned.
      required: [ok, replayed, reference, status, total, currency, access_code, customer]
      properties:
        ok: { type: boolean, const: true }
        replayed:
          type: boolean
          description: >-
            `false` — this request created the booking. `true` — this
            Idempotency-Key had been used before and the booking's CURRENT state
            is being returned.
        reference: { $ref: "#/components/schemas/BookingReference" }
        status: { $ref: "#/components/schemas/BookingStatus" }
        total:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: >-
            The booking's cumulative total. On a replay this includes any
            extension charged since the original create.
        currency: { $ref: "#/components/schemas/Currency" }
        access_code:
          description: |
            The code that opens the compartment, or `null`.

            This is genuinely two-valued rather than an optional string, and the
            discriminating condition is **not** the request — it is the booking:

            * a **six-digit string** when the booking became `active` at creation
              (a `counterparty_collects` partner settles immediately) AND the
              location is not a beach location;
            * **`null`** when either of those fails — a `we_collect` booking
              still `pending` on the payment gateway has no code minted yet, and
              a **beach location never has one at all**, because a beach passcode
              is set by the customer rather than issued by us.

            A `null` here is not an error and is not retryable by re-creating.
            For the pending-payment case the code appears once payment settles
            and can then be fetched with `POST /resend-code`; for the beach case
            there will never be one through this API.
          oneOf:
            - allOf: [{ $ref: "#/components/schemas/AccessCode" }]
              title: Minted
              description: >-
                The booking is active at a code-issuing (non-beach) location.
            - type: "null"
              title: Absent
              description: >-
                Either the booking is `pending` awaiting payment, or the location
                is a beach location.
        customer: { $ref: "#/components/schemas/CustomerEcho" }
      additionalProperties: true
    BookingSize:
      type: object
      required: [id, name, quantity]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        quantity:
          type: integer
          minimum: 1
          description: Compartments of this size in the booking.
      additionalProperties: true
    Booking:
      type: object
      description: >-
        One booking, in the single shape shared by the list and the detail
        endpoints. No access code and no customer are included.
      required: [reference, status, booking_type, location, start, end, total, currency, sizes, overstay]
      properties:
        reference: { $ref: "#/components/schemas/BookingReference" }
        status: { $ref: "#/components/schemas/BookingStatus" }
        booking_type:
          type: string
          enum: [standard, test]
          description: >-
            `test` for a booking made with a test key (0.268.0) or by a tester customer;
            `standard` otherwise. Test bookings accrue no commission and never appear in
            staff booking views. Added 0.269.0.
        location:
          type: string
          description: The location's display name. Not its id.
        start:
          allOf: [{ $ref: "#/components/schemas/Instant" }]
          description: Earliest start across the booking's compartments.
        end:
          allOf: [{ $ref: "#/components/schemas/Instant" }]
          description: >-
            Latest end across the booking's compartments — this moves when the
            booking is extended.
        total: { $ref: "#/components/schemas/Money" }
        currency: { $ref: "#/components/schemas/Currency" }
        sizes:
          type: array
          items: { $ref: "#/components/schemas/BookingSize" }
        overstay: { $ref: "#/components/schemas/BookingOverstay" }
      additionalProperties: true
    BookingOverstay:
      type: object
      description: >-
        The overstay owed on this booking RIGHT NOW (0.283.0), from the same
        computation the kiosk uses. A `counterparty_collects` partner's customer
        who overstays is sent to the partner to settle; this is the figure to
        settle. Read it at the moment you need it — it grows while the
        compartment stays occupied.
      required: [state, amount, currency, minutes, unpriced, grace_end]
      properties:
        state:
          type: string
          description: >-
            For an active booking: `scheduled` (inside the window), `grace`
            (past `end`, inside the free grace), `overdue` (owed), or
            `clear_due` (the clear deadline has passed). For any other booking
            its own status (`completed`, `cancelled`, …). `unscheduled` when the
            booking never activated.
        amount:
          type: [number, "null"]
          description: >-
            Owed now, in `currency`. `0` when nothing is owed. `null` when a
            compartment's size has no overstay rate — see `unpriced`. Null is
            "cannot be priced", not zero; do not render it as zero.
        currency: { $ref: "#/components/schemas/Currency" }
        minutes:
          type: integer
          minimum: 0
          description: Whole minutes past the end of grace; 0 until then.
        unpriced:
          type: boolean
          description: True when at least one compartment's size carries no overstay rate.
        grace_end:
          oneOf: [{ $ref: "#/components/schemas/Instant" }, { type: "null" }]
          description: When the free grace after `end` runs out; null when unscheduled.
      additionalProperties: true
    BookingsListOk:
      type: object
      required: [ok, partner_id, bookings, has_more, next_cursor]
      properties:
        ok: { type: boolean, const: true }
        partner_id: { type: string, format: uuid }
        bookings:
          type: array
          maxItems: 100
          description: One page, newest first, at most `limit` rows.
          items: { $ref: "#/components/schemas/Booking" }
        has_more:
          type: boolean
          description: True when a further page exists; then `next_cursor` is set.
        next_cursor:
          type: [string, "null"]
          description: >-
            Opaque cursor for the next page, or null on the last page. Pass back as
            `cursor`. Keyset over (creation time, id), so a tie on creation time never
            skips or repeats a row.
      additionalProperties: true
    BookingDetailOk:
      type: object
      required: [ok, booking]
      properties:
        ok: { type: boolean, const: true }
        booking: { $ref: "#/components/schemas/Booking" }
      additionalProperties: true

    # ── lifecycle payloads ───────────────────────────────────────────────────
    ReferenceRequest:
      type: object
      required: [reference]
      properties:
        reference: { $ref: "#/components/schemas/BookingReference" }
      additionalProperties: false
    ExtendRequest:
      type: object
      required: [reference, extend_minutes]
      properties:
        reference: { $ref: "#/components/schemas/BookingReference" }
        extend_minutes:
          type: integer
          minimum: 60
          description: >-
            Minutes to add. At least 60 and at most 525600 (365 days); the
            resulting end must also fall within 366 days of now.
          maximum: 525600
      additionalProperties: false
    CancelOk:
      type: object
      required: [ok, reference, status]
      properties:
        ok: { type: boolean, const: true }
        reference: { $ref: "#/components/schemas/BookingReference" }
        status:
          type: string
          const: cancelled
      additionalProperties: true
    EndOk:
      type: object
      required: [ok, reference, status]
      properties:
        ok: { type: boolean, const: true }
        reference: { $ref: "#/components/schemas/BookingReference" }
        status:
          type: string
          const: completed
      additionalProperties: true
    ExtendOk:
      type: object
      required: [ok, replayed, reference, status, end, extension_charge, currency, total]
      properties:
        ok: { type: boolean, const: true }
        replayed:
          type: boolean
          description: >-
            `true` when this Idempotency-Key had already been used. Unlike a
            create replay, the payload is the stored result of the original
            extension.
        reference: { $ref: "#/components/schemas/BookingReference" }
        status:
          allOf: [{ $ref: "#/components/schemas/BookingStatus" }]
          description: >-
            The booking's status as it stood when the extension was accepted —
            `pending` or `active`.
        end:
          allOf: [{ $ref: "#/components/schemas/Instant" }]
          description: The booking's new end.
        extension_charge:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: What this extension cost. Accrues its own commission entry.
        currency: { $ref: "#/components/schemas/Currency" }
        total:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: The booking's new cumulative total, extension included.
      additionalProperties: true
    AccessCodeOk:
      type: object
      description: >-
        Returned by `resend-code` and `reissue-code`. `access_code` is always a
        real code here — the cases that would have produced a null (beach
        location, no code yet) are refused with `409 invalid_state` instead.
      required: [ok, reference, status, access_code]
      properties:
        ok: { type: boolean, const: true }
        reference: { $ref: "#/components/schemas/BookingReference" }
        status:
          allOf: [{ $ref: "#/components/schemas/BookingStatus" }]
          description: The booking's status — necessarily `pending` or `active`.
        access_code: { $ref: "#/components/schemas/AccessCode" }
      additionalProperties: true
