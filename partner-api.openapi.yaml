openapi: 3.1.0

# ─────────────────────────────────────────────────────────────────────────────
# CityLockers Partner API — Direction A (inbound), the contract.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for the partner-facing surface of the
# `partner-bridge` Supabase Edge Function. It is authored BY HAND from the code
# (supabase/functions/partner-bridge/index.ts plus the `partner.*` and
# `booking.*` RPCs it calls) and reconciled against a live end-to-end exercise
# of all eleven endpoints on the dev branch project (2026-08-15). Where the code
# and the live run disagreed, THE LIVE OBSERVATION WON and the disagreement is
# recorded in the description below and in `x-observed` on the affected
# responses.
#
# It describes the API AS IT BEHAVES, not as it would ideally be shaped. No
# reason string has been renamed for tidiness; no route has been made more
# RESTful. Phase 4 generates the Postman collection, the rendered docs and the
# drift guard FROM THIS FILE — none of those are in scope here.
#
# Validation: `npm run spec:validate`
# (@seriousme/openapi-schema-validator, pinned; see package.json).
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: CityLockers Partner API (Direction A, inbound)
  version: 1.0.0
  summary: >-
    Sell CityLockers locker capacity from your own product: discover locations,
    price a window, create and manage bookings, and hand your customer an access
    code.
  description: |
    The Direction A partner API lets a partner sell CityLockers locker capacity
    inside its own product. Every call is authenticated with a partner API key,
    every result is scoped to the partner that key belongs to, and every response
    — success or failure — uses the same envelope.

    ## The envelope

    Every response body is a JSON object carrying `ok`.

    * `ok: true` — the operation succeeded. The rest of the object is the
      operation's payload.
    * `ok: false` — the operation was refused. `reason` is always present and is
      a machine-readable string from the vocabulary under *Reason codes*.
      `error` is sometimes
      present and is a human-readable sentence; **branch on `reason`, never on
      `error`**, and never on the HTTP status alone.

    There is no separate error object and no `errors` array. A refusal is never
    delivered as a bare HTTP status with an empty body.

    ## Getting started

    1. **Ask your CityLockers contact for a partner API key.** Keys are issued by
       us; there is no self-service signup. The key is what defines which
       locations you may sell, which operations you may call, and which booking
       windows you are allowed to offer.
    2. **Call `GET /bootstrap` once, at startup, and configure your UI from what
       it returns** — your locations, the locker sizes offered at each, your
       period policy, your granted operations, and the mode of the key you hold.
       **Do not hard-code any of it.** Every one of those is a property of the
       key and can change without a release on your side.
    3. **Price a window with `GET /quote` and check stock with `GET
       /availability`** before you show a price or a "book" button. Neither
       creates anything.
    4. **Create the booking with `POST /bookings`,** carrying an
       `Idempotency-Key`. You get back a booking `reference` and, where one
       exists, the customer's `access_code`.
    5. **Manage it afterwards** with `GET /booking`, `POST /extend`,
       `POST /cancel`, `POST /end`, `POST /resend-code` and
       `POST /reissue-code`.

    **You hold two keys, and the difference is the key, not the host.** A `live`
    key transacts against your real scoped locations: real lockers, real money,
    real customer notifications, and a commission entry on our ledger for every
    create and every extend. A `test` key (0.268.0) uses the **same endpoints on
    the same host** and is scoped to a shared **fixture location** — inventory
    that is not sold to anyone. A booking made with a test key is stamped
    `booking_type = 'test'` (it never appears in our staff booking views) and
    **accrues no commission**: neither its create nor any later extend writes a
    ledger row. Everything else — availability, quote, the access code, cancel,
    end, the idempotency contract — behaves exactly as live. Integrate against
    the test key; go live by swapping the credential. Read which one you hold
    from `GET /bootstrap`'s `mode` field.

    **Keep the key on your server.** Never put it in a browser, a mobile app, a
    URL or a repository. It is a bearer credential: whoever holds it is you.

    ## The flow, in order

    ```
    bootstrap ──▶ availability ──▶ quote ──▶ create ──▶ (extend | cancel | end)
       once          per search     per      per            per booking
     at startup                    window   basket
    ```

    `bootstrap` is a startup call, not a per-request one. `availability` and
    `quote` answer different questions and neither is authoritative: **create is
    the only gate**. A window `availability` happily counts and `quote` happily
    prices can still be refused by create — `period_not_allowed` if it falls
    outside your key's period policy, `unavailable` if a concurrent booking took
    the compartment first, `invalid` if it is under the engine's real floor.
    Treat a create refusal as normal control flow, not as an exception.

    ## Routing: dispatch on the trailing path segment

    The API is one Edge Function invoked at `/partner-bridge`. The sub-route is
    the **trailing path segment** of the request URL, and the method then selects
    the operation (`GET /bookings` lists, `POST /bookings` creates). This is
    described here faithfully rather than reshaped.

    Two consequences a generated client must respect:

    1. **A bare `POST` with no path segment resolves to `bookings` (create).**
       `POST /partner-bridge` and `POST /partner-bridge/bookings` are the same
       operation. This is documented below as the path `/` and was proven live —
       a real second booking was created through a request with no trailing
       segment at all. It is an alias, not a twelfth endpoint.
    2. **An unrecognised segment, or a recognised segment with the wrong method,
       returns `404 not_found`** — the same reason string a missing booking
       reference produces. A 404 therefore does not by itself mean "no such
       booking".

    ## Authentication

    `Authorization: Bearer <key>` on every call, including the ones that can fail
    before the key is checked (see the create endpoint's security note).

    A raw key is `kpk_<mode>_<8hex>_<64hex>`, e.g.
    `kpk_live_1a2b3c4d_<64 hex characters>`. Only the fourth segment is secret.
    The first three segments together are the key's non-secret **prefix**
    (`kpk_live_1a2b3c4d`); it is what the server stores alongside the SHA-256
    hash of the full key, what the rate limiter buckets on, and the only part
    safe to quote in a support ticket or a log line.

    `mode` is a property of the key itself, `live` or `test`, and is the source
    of truth for what the credential does. It is surfaced to you on
    `GET /bootstrap` as the top-level `mode` field. Both modes are minted
    (0.268.0). The mode is threaded server-side from the verified key into the
    create and extend procedures: a `test` key's bookings are stamped
    `booking_type = 'test'` and accrue no commission; a `live` key's are
    `standard` and do. Nothing in a request body can change a key's mode.

    **Legacy two-segment keys (`kpk_<8hex>_<64hex>`) no longer authenticate.**
    Verification derives the prefix from the first three segments, so a
    two-segment key yields a prefix that matches no stored row and is rejected
    as `unauthorized`.

    Verification hashes the full raw key with SHA-256 and constant-time compares
    it against the stored hash, scoped to an **active key belonging to an active
    partner**. Anything else — no key, malformed key, revoked key, suspended
    partner — is `401 unauthorized`.

    ## Rate limiting

    60 requests per minute per key prefix, over-limit → `429 rate_limited`. The
    limiter is an in-process token bucket: it resets when the function instance
    cold-starts and is not shared across instances, so the effective limit is a
    floor, not a guarantee. Treat 429 as retryable with backoff. This behaviour
    is expected to be replaced by a durable shared counter; do not build a client
    that depends on the current leniency.

    ## Idempotency

    `Idempotency-Key` is **required on the two operations that move money**:
    `POST /bookings` (create) and `POST /extend`. It is not read on any other
    endpoint. A missing or blank header is `400 invalid` before any work is done.

    Replaying a key that has already been used returns the earlier request's
    outcome instead of acting twice.

    **A replay returns LIVE CURRENT STATE, not a frozen echo of the original
    response.** This is the single most important thing to understand about
    replay on this API, and it was proven live: a create replayed after the
    booking had been extended and then cancelled came back with
    `status: "cancelled"` and `total: 18`, where the original create had returned
    `status: "active"` and `total: 9`. The create replay branch re-reads the
    booking and customer rows at replay time. So on a create replay,
    `status`, `total` and `access_code` describe the booking **now**;
    only `reference` and `replayed: true` are stable facts about the original
    request. (`POST /extend` differs: its replay returns the stored result
    object of the original extension, stamped `replayed: true`.)

    A replay of a request that was *rejected* returns the original rejection
    reason with the original status. A replay that arrives while the first
    request is still in flight returns `409 in_progress`.

    ## Booking windows: two shapes, and a floor that is not where you expect

    **Send either `duration_minutes` or `end_time`, not both.** They are
    alternative spellings of the same window and create accepts both:

    * `duration_minutes` — an integer count of minutes from `start_time`. If you
      send both fields, **`duration_minutes` wins** and `end_time` is ignored.
    * `end_time` — an ISO-8601 instant. The window is then derived from
      `start_time` (or from now, if you omit `start_time`).

    Omit `start_time` to mean "now". `GET /availability` and `GET /quote` take
    only `duration_minutes`, so if your UI works in end times you convert before
    you price.

    **The floor is 180 minutes, not the 60 the edge function accepts.** This is
    the single most common way a first integration fails, and it fails *late*:
    the edge function rejects anything under 60 minutes outright, but the booking
    engine's smallest chip is **180 minutes**, so a 60–179 minute request passes
    edge validation, reaches the engine, and comes back `400 invalid` with no
    hint that duration was the problem. **If you offer sub-3-hour windows in your
    UI, they will all fail.** Above a day, the window must be a whole number of
    1440-minute blocks or it is `invalid_duration`.

    ## Reason codes, and why they are documented per endpoint

    The full reason vocabulary the code can emit is:

    | reason | usual status | meaning |
    |---|---|---|
    | `unauthorized` | 401, sometimes 403 | no usable key, or the partner is not active |
    | `capability` | 403 | the partner lacks the *inbound* direction capability |
    | `out_of_scope` | 403 | the location is not in this key's scope |
    | `not_permitted` | 403 | the partner is not granted this operation |
    | `not_found` | 404 | no such booking for this partner, or no such route |
    | `unavailable` | 409 | nothing free / nothing priceable for the request |
    | `in_progress` | 409 | a concurrent replay of the same Idempotency-Key |
    | `invalid_state` | 409 | the booking is not in a state this operation accepts |
    | `window_not_expired` | 409 | see the note below — **unreachable today** |
    | `invalid` | 400 | malformed or missing input |
    | `invalid_duration` | 400 | the duration is structurally wrong |
    | `period_not_allowed` | 400 | the partner's period policy forbids this window |
    | `rate_limited` | 429 | over the per-key request budget |
    | `server_error` | 500 | an internal failure; retry is reasonable |

    **`reason` alone does not determine the HTTP status, which is why this spec
    models reason→status per endpoint per branch instead of publishing one global
    table.** The concrete case: `unauthorized` is **401** when it comes from a
    route's own key-verification branch (the common case — no key, bad key), and
    **403** when it is returned by a wrapper RPC's *partner-not-active* branch
    and mapped by the generic reason→status mapper. The two have never been
    observed colliding, because key verification already scopes to an active
    partner, so the 403 flavour is only reachable if a partner is deactivated in
    the window between verification and the operation's own read. It is
    nonetheless a real branch in shipped code, and a client keyed on a single
    global `reason`→status table will mis-handle it. Each operation below lists
    only the reasons that operation can actually produce, and each response says
    which branch produces it.

    Two further notes on the enum:

    * **`window_not_expired` is unreachable.** It is documented here for
      completeness of the vocabulary only. The window-expiry guard on ending a
      booking was **deleted** in migration `20260728140000_end_booking_early.sql`,
      whose own header records that the reason string was left in the status maps
      deliberately, to avoid needless API churn. `POST /end` completes a live
      booking immediately, before its window closes — proven live. It is **not**
      listed as a response of `POST /end` anywhere in this document, and it will
      only become reachable if that deleted guard is reinstated.
    * **`period_not_allowed` is real and was missing from the earlier written
      accounts of this API.** `POST /bookings` returns it (as a `400`) when the
      requested window falls outside the partner's own intraday/multiday policy.

    ## Grant vocabulary

    A key's partner holds a set of granted operations. `GET /bootstrap` returns
    them as `granted_operations`, an array of objects — `{ key, kind, label }`,
    **not** an array of bare strings. The `key` values are the grant keys, and
    each callable endpoint below names the one it requires in `x-grant-key`.

    | grant key | kind | endpoint |
    |---|---|---|
    | `locations` | read | `GET /bootstrap` |
    | `availability` | read | `GET /availability` |
    | `quote` | read | `GET /quote` |
    | `bookings.list` | read | `GET /bookings` |
    | `booking.read` | read | `GET /booking` |
    | `booking.create` | write | `POST /bookings` (and bare `POST /`) |
    | `booking.cancel` | write | `POST /cancel` |
    | `booking.end` | write | `POST /end` |
    | `booking.extend` | write | `POST /extend` |
    | `booking.resend_code` | write | `POST /resend-code` |
    | `booking.reissue_code` | write | `POST /reissue-code` |

    Calling an endpoint whose grant the partner does not hold is
    `403 not_permitted`. A grant is checked inside the operation, so a missing
    grant is reported after authentication, never instead of it.

    Three further operation keys exist in the server-side registry but are **not
    built** and have no endpoint: `booking.open`, `booking.add_lockers`,
    `booking.overstay`. They are listed under `x-planned-operations` at the root
    of this document so a client can recognise the strings, and they deliberately
    appear nowhere as a path. If one of them shows up in your
    `granted_operations`, there is still nothing to call.

    ## Behaviours that surprise integrators

    * **Customer identity is first-write-wins by email.** Creating a booking
      resolves the customer by email (or phone) and reuses the existing row if
      one matches. A later create under the same email with a *different* `name`
      does **not** update the stored name, and the response echoes the stored
      one. Proven live: a create sending `"E2E Rerun B"` came back with the
      earlier `"E2E Rerun A"`. Do not use the returned `customer.name` to confirm
      what you sent.
    * **`access_code` is not always present on a create.** See the create
      response schema — it is `string` or `null`, and the two conditions that
      produce `null` are named there.
    * **`resend-code` and `reissue-code` do not email the customer.** They return
      the code in the response body and nothing else leaves the platform.
      Delivering it to the end customer is the partner's job. (`reissue-code`
      additionally enqueues a device event so the physical keypad learns the new
      code; until that is consumed, the OLD code still opens the door.)
    * **`GET /bookings` is capped at 100 rows, newest first, with no
      pagination.** There is no cursor, no `offset` and no total count.
    * **Times are UTC ISO-8601 instants.** Multi-day quoting anchors on the
      Asia/Dubai business date, which can make a multi-day quote indicative
      rather than exact; a create charges from the real booking start.

    ## Data handling

    Creating a booking sends us your customer's contact details — an email
    address, or a phone number, and optionally a name — because a booking
    resolves to a customer record on our side and a confirmation notification is
    sent to that address. That makes both parties handlers of personal data under
    the **UAE Personal Data Protection Law (Federal Decree-Law No. 45 of 2021)**,
    and a short data-handling understanding forms part of the partner agreement.
    Agree it before you send live traffic, not after.

    Practically, three rules:

    * **Customer data goes in the request body, over HTTPS, never in a URL.** No
      endpoint here takes a customer identifier as a query parameter, and a URL
      is logged in places a body is not.
    * **Send the minimum that identifies the customer.** One of `email` or
      `phone` is required; `name` is optional and is only used for the booking
      record.
    * **Customer identity is first-write-wins by email** — see *Behaviours that
      surprise integrators*. The record we keep may not carry the name you sent,
      so do not treat the echoed `customer` object as confirmation of what you
      submitted.

    ## About the examples

    **Every example in this document is illustrative.** The response examples are
    reproduced from a real end-to-end run against the dev branch project on
    2026-08-15, with every identifier, address, code and reference replaced by an
    obviously synthetic placeholder. No example contains a real customer email, a
    real access code, a real partner key or a real booking reference. Do not
    treat any identifier here as callable, and do not copy an example UUID into a
    request.
  contact:
    name: CityLockers partner integrations
  x-source-of-truth: supabase/functions/partner-bridge/index.ts
  x-authored-from:
    - supabase/functions/partner-bridge/index.ts (edge dispatch, statuses, header rules)
    - supabase/functions/partner-bridge/key_prefix.ts (key prefix derivation)
    - supabase/migrations/20260530070436_baseline.sql (partner.* and booking.*_via_partner RPCs)
    - supabase/migrations/20260815170000_partner_api_key_mode.sql (key mode + three-segment prefix)
    - supabase/migrations/20260906090000_partner_test_key_spine.sql (test keys mint; p_mode threaded into create/extend)
    - supabase/migrations/20260906100000_partner_bookings_pagination.sql (bookings filters, keyset cursor, booking_type)
    - supabase/migrations_archive/20260728140000_end_booking_early.sql (window guard deletion)
    - CC Reports/khizana/2026-08-15-partner-api-e2e-rerun.md (live observation, authoritative)

servers:
  - url: https://dyxplwuxytotvwpxtksv.functions.supabase.co/partner-bridge
    description: >-
      Production. Supabase project ref `dyxplwuxytotvwpxtksv`. Real bookings,
      real money, real customer notifications. A `kpk_live_…` key issued for
      production authenticates here and nowhere else.
  - url: https://xqpzaelgjcrgiajairaa.functions.supabase.co/partner-bridge
    description: >-
      Dev branch. Supabase project ref `xqpzaelgjcrgiajairaa`. A separate
      database with its own partners, keys, locations and bookings — a key from
      one host never works on the other. This is where the live exercise behind
      this document was run. Note that it is a *development branch*, not a
      customer-facing sandbox: bookings created here still fire real
      confirmation notifications to whatever address you supply.

security:
  - partnerApiKey: []

tags:
  - name: Discovery
    description: What this key may sell, and what it costs.
  - name: Bookings
    description: Creating and reading bookings.
  - name: Lifecycle
    description: Changing a booking after it exists.
  - name: Access codes
    description: Handing the end customer a way in.

x-planned-operations:
  - key: booking.open
    kind: write
    label: Open locker
    status: planned
    note: >-
      Present in the server-side operation registry with is_built = false. No
      endpoint exists. Opening a locker remotely is not callable through this
      API.
  - key: booking.add_lockers
    kind: write
    label: Add lockers
    status: planned
    note: >-
      Present in the registry with is_built = false. No endpoint exists. Adding
      lockers to an existing booking is not callable; create a second booking.
  - key: booking.overstay
    kind: write
    label: Overstay charge
    status: planned
    note: >-
      Present in the registry with is_built = false. No endpoint exists.
      Overstay is handled entirely platform-side today.

paths:
  /bootstrap:
    get:
      tags: [Discovery]
      operationId: getBootstrap
      summary: What this key can sell
      description: |
        Self-configuration for the integration: the partner id, the period
        policy the partner is held to, the operations the partner is granted,
        the locations in this key's scope with the locker sizes offered at each,
        and the **mode of the key you presented**.

        `sizes[].capacity` is the STATIC count of operational compartments of
        that size at the location — how many physically exist and are in
        service. It is not live availability; a size can show `capacity: 12` and
        have nothing free right now. Use `GET /availability` for that.

        `locations[].opening_hours` is when a location is open, as **free text** —
        not a structured schedule. Show it; do not parse it. The value is
        EFFECTIVE: the location's own hours where it has them, otherwise its
        parent building's. `null` means neither is set, which is *unknown*, not
        *closed*. The key is always present. See the `Location` schema.
      x-grant-key: locations
      x-idempotency-key: not-read
      responses:
        "200":
          description: |
            The key's scoped configuration.

            **`mode` is spliced in by the edge function, not by the RPC.** The
            underlying `partner.partner_bootstrap(partner_id)` procedure has no
            concept of which key was presented — it is keyed on the partner, and
            a partner can hold several keys. The edge function appends `mode`
            last, from the row of the key that just authenticated, so the
            authenticated value always wins. A schema derived from the RPC's
            return object alone would silently omit this field; it is a real,
            load-bearing part of the response.
          x-observed: live 2026-08-15
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapOk" }
              examples:
                observed:
                  summary: Live capture, sanitised
                  description: >-
                    Reproduced from the 2026-08-15 run. The run's capture elided
                    `granted_operations` as "11 entries"; the array shown here is
                    the full set of eleven built operations from the server-side
                    registry, which is what those eleven entries are.
                  value:
                    ok: true
                    partner_id: "11111111-1111-4111-8111-111111111111"
                    period_policy:
                      allow_intraday: true
                      allow_multiday: true
                      day_minutes: 1440
                      multiday_max_minutes: 527040
                      intraday_durations: []
                    granted_operations:
                      - { key: "availability", kind: "read", label: "Availability" }
                      - { key: "booking.cancel", kind: "write", label: "Cancel booking" }
                      - { key: "booking.create", kind: "write", label: "Create booking" }
                      - { key: "booking.end", kind: "write", label: "End booking" }
                      - { key: "booking.extend", kind: "write", label: "Extend booking" }
                      - { key: "booking.read", kind: "read", label: "Booking detail" }
                      - { key: "booking.reissue_code", kind: "write", label: "Reissue access code" }
                      - { key: "booking.resend_code", kind: "write", label: "Resend access code" }
                      - { key: "bookings.list", kind: "read", label: "My bookings" }
                      - { key: "locations", kind: "read", label: "Locations" }
                      - { key: "quote", kind: "read", label: "Price quote" }
                    locations:
                      - id: "22222222-2222-4222-8222-222222222222"
                        name: "Example Location"
                        address: null
                        lat: null
                        lon: null
                        opening_hours: null
                        sizes:
                          - { id: "33333333-3333-4333-8333-333333333333", name: "large", capacity: 2 }
                          - { id: "44444444-4444-4444-8444-444444444444", name: "medium", capacity: 1 }
                          - { id: "55555555-5555-4555-8555-555555555555", name: "small", capacity: 2 }
                    mode: "live"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The partner is not granted the `locations` operation.
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorNotPermitted" }
              example: { ok: false, reason: "not_permitted" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /availability:
    get:
      tags: [Discovery]
      operationId: getAvailability
      summary: Free compartments per size for a window
      description: |
        Live free count per locker size at one scoped location, for a window.
        The count uses the same predicate the create path uses to pick lockers,
        so it agrees with what a create would allow for the same window. A full
        size still appears, with `available: 0`.

        It does **not** re-enforce the partner's period policy — create is the
        authoritative gate. A window this endpoint happily counts can still be
        refused by create with `period_not_allowed`.
      x-grant-key: availability
      x-idempotency-key: not-read
      parameters:
        - name: location_id
          in: query
          required: true
          description: A location id from `GET /bootstrap`. Must be in this key's scope.
          schema: { type: string, format: uuid }
          example: "22222222-2222-4222-8222-222222222222"
        - name: duration_minutes
          in: query
          required: true
          description: >-
            Window length in whole minutes, at least 1. Note this endpoint's
            floor is far below what a create will accept.
          schema: { type: integer, minimum: 1 }
          example: 480
        - name: start_time
          in: query
          required: false
          description: >-
            Window start as an ISO-8601 instant. Omit for "now" — the server
            defaults to the current time.
          schema: { type: string, format: date-time }
          example: "2026-08-15T19:32:20Z"
      responses:
        "200":
          description: Free count per offered size for the requested window.
          x-observed: live 2026-08-15
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityOk" }
              examples:
                observed:
                  summary: Live capture, sanitised (8-hour window)
                  value:
                    ok: true
                    location_id: "22222222-2222-4222-8222-222222222222"
                    start: "2026-08-15T19:32:20Z"
                    duration_minutes: 480
                    end: "2026-08-16T03:32:20Z"
                    availability:
                      - { id: "33333333-3333-4333-8333-333333333333", name: "large", available: 2 }
                      - { id: "44444444-4444-4444-8444-444444444444", name: "medium", available: 1 }
                      - { id: "55555555-5555-4555-8555-555555555555", name: "small", available: 2 }
        "400":
          description: >-
            `invalid` — `location_id` missing, or `duration_minutes` missing,
            non-integer or below 1. Raised by the edge function before the RPC
            is called, and again by the RPC as a backstop.
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorInvalid" }
              example:
                ok: false
                reason: "invalid"
                error: "location_id and a positive duration_minutes are required."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            Two distinct branches, both 403:

            * `out_of_scope` — the location exists but is not in this key's scope.
              Checked first.
            * `not_permitted` — the partner is not granted `availability`.
          x-observed: "out_of_scope observed live 2026-08-15; not_permitted not observed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorScopedForbidden" }
              examples:
                out_of_scope:
                  summary: Live capture — location outside the key's scope
                  value: { ok: false, reason: "out_of_scope" }
                not_permitted:
                  summary: Grant missing (not observed live)
                  value: { ok: false, reason: "not_permitted" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /quote:
    get:
      tags: [Discovery]
      operationId: getQuote
      summary: Price a size and window without booking
      description: |
        The tier price for one locker size at a scoped location over a window,
        without creating anything. It reads the same price engine every charge
        path reads, so a quote agrees with what a create would charge for the
        same inputs.

        Where several price models are attached at a location, the **cheapest
        model that can price the request wins**. `per_locker` is that model's
        unit price; `amount` is `per_locker × quantity` with the model's
        multi-locker discount applied and rounded up to the currency's minor
        unit.

        As with availability, the partner's period policy is not re-enforced
        here.
      x-grant-key: quote
      x-idempotency-key: not-read
      parameters:
        - name: location_id
          in: query
          required: true
          schema: { type: string, format: uuid }
          example: "22222222-2222-4222-8222-222222222222"
        - name: locker_size_id
          in: query
          required: true
          description: A size id from `GET /bootstrap`'s `locations[].sizes[]`.
          schema: { type: string, format: uuid }
          example: "33333333-3333-4333-8333-333333333333"
        - name: duration_minutes
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
          example: 480
        - name: quantity
          in: query
          required: false
          description: Number of lockers of this size. Defaults to 1.
          schema: { type: integer, minimum: 1, default: 1 }
          example: 1
      responses:
        "200":
          description: The price for the requested size, quantity and window.
          x-observed: live 2026-08-15
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteOk" }
              examples:
                observed:
                  summary: Live capture, sanitised (one large locker, 8 hours)
                  value:
                    ok: true
                    location_id: "22222222-2222-4222-8222-222222222222"
                    locker_size_id: "33333333-3333-4333-8333-333333333333"
                    quantity: 1
                    duration_minutes: 480
                    per_locker: 9
                    amount: 9
                    currency: "AED"
        "400":
          description: >-
            `invalid` — a required parameter is missing or non-positive
            (edge-level), or price models exist at the location but **none can
            price this size for this duration** (RPC-level: a non-chip duration,
            a size not offered, or no anchor). The two branches are not
            distinguishable from the response.
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorInvalid" }
              example:
                ok: false
                reason: "invalid"
                error: "location_id, locker_size_id and a positive integer duration_minutes are required."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            * `out_of_scope` — the location is not in this key's scope.
            * `not_permitted` — the partner is not granted `quote`.
          x-observed: not observed live on this endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorScopedForbidden" }
              example: { ok: false, reason: "out_of_scope" }
        "409":
          description: >-
            `unavailable` — no deployed wall at the location carries a price
            model at all, so nothing there can be priced. Distinct from the 400
            case, where a model exists but cannot price these particular inputs.
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorUnavailable" }
              example: { ok: false, reason: "unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /bookings:
    get:
      tags: [Bookings]
      operationId: listBookings
      summary: List this key's bookings
      description: |
        The bookings this partner has created through the API, newest first,
        **one page at a time** (0.269.0). Each row has the same object shape
        `GET /booking` returns for one booking, and now carries `booking_type`
        so a `test`-key booking can be told from a live one.

        **Paging.** Up to `limit` rows (default and maximum 100). When more
        remain, `has_more` is `true` and `next_cursor` is set; pass it back as
        `cursor` to fetch the next page. The cursor is **opaque** — do not
        parse, construct or store it beyond the next request. It is a keyset
        over the request's creation time AND its id, so a page boundary that
        falls between two bookings created in the same instant neither skips
        nor repeats a row. A cursor that does not decode is `400 invalid`.

        **Filters.** `status` matches the booking's lifecycle state exactly;
        `mode=test` returns only bookings made with a test key (or by a tester
        customer); `mode=live` returns everything else.

        Access codes are never included here — that is `POST /resend-code`'s job
        and it is granted separately.
      x-grant-key: bookings.list
      x-idempotency-key: not-read
      parameters:
        - $ref: "#/components/parameters/BookingsStatus"
        - $ref: "#/components/parameters/BookingsMode"
        - $ref: "#/components/parameters/BookingsLimit"
        - $ref: "#/components/parameters/BookingsCursor"
      responses:
        "200":
          description: One page of the partner's bookings, newest first.
          x-observed: live 2026-08-15 (single page); paging proven 2026-09-06 against the dev branch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingsListOk" }
              examples:
                observed_empty:
                  summary: Live capture — a partner with no bookings yet
                  value:
                    ok: true
                    partner_id: "11111111-1111-4111-8111-111111111111"
                    bookings: []
                    has_more: false
                    next_cursor: null
                populated:
                  summary: >-
                    The same response once a booking exists. The row is the
                    booking-detail object captured live on 2026-08-15,
                    sanitised, with booking_type added in 0.269.0.
                  value:
                    ok: true
                    partner_id: "11111111-1111-4111-8111-111111111111"
                    has_more: false
                    next_cursor: null
                    bookings:
                      - reference: "CL-EXAMPLE-0001"
                        status: "active"
                        booking_type: "standard"
                        location: "Example Location"
                        start: "2026-08-15T19:32:21Z"
                        end: "2026-08-16T03:32:21Z"
                        total: 9
                        currency: "AED"
                        sizes:
                          - { id: "33333333-3333-4333-8333-333333333333", name: "large", quantity: 1 }
                        overstay:
                          state: "scheduled"
                          amount: 0
                          currency: "AED"
                          minutes: 0
                          unpriced: false
                          grace_end: "2026-08-16T03:47:21Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The partner is not granted the `bookings.list` operation.
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorNotPermitted" }
              example: { ok: false, reason: "not_permitted" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Create a booking
      description: |
        Reserve lockers at a scoped location for a window, resolve or create the
        end customer, price and settle the booking according to the partner's
        collection mode, and return the access code where one exists.

        **Settlement is read from the partner record, never from this request.**
        A `counterparty_collects` partner (you collected the money) settles
        immediately: the booking comes back `active` with an access code. A
        `we_collect` partner awaits the payment gateway: the booking comes back
        `pending` with `access_code: null`.

        **A confirmation notification fires to the customer** on a booking that
        becomes active. This happens on the dev branch host too.

        **Duration.** Send either `duration_minutes` or `end_time`; an explicit
        `duration_minutes` wins, otherwise the window is derived from `end_time`
        against `start_time` (or now). The edge function refuses anything below
        60 minutes, but the booking engine's real floor is **180 minutes** (the
        smallest chip), so a 60–179 minute request passes the edge check and is
        then refused by the engine with `invalid`. Above a day, the window must
        be a whole number of 1440-minute blocks or it is `invalid_duration`.

        **Customer identity is first-write-wins by email** — see the note in the
        API description. The `customer` object returned is the *stored* customer,
        which may not carry the name you sent.

        ### Security note, specific to this endpoint

        `Idempotency-Key` presence and JSON body parsing both happen **before**
        the API key is verified on this route. A missing header or a malformed
        body therefore returns `400 invalid` **without authentication** — the
        `400 invalid` branch here is reachable by an unauthenticated caller.
        This is confirmed live. It is specific to create: every other endpoint
        verifies the key first, so their `400 invalid` branches are reachable
        only after authentication. The shape-validation 400 (missing
        `location_id`, bad `items`, no customer identifier, sub-60-minute
        window) is likewise pre-authentication on this route.
      x-grant-key: booking.create
      x-idempotency-key: required
      x-unauthenticated-branches:
        - "400 invalid — Idempotency-Key header missing or blank"
        - "400 invalid — malformed JSON body"
        - "400 invalid — missing or malformed field (shape validation)"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingRequest" }
            examples:
              intraday:
                summary: One large locker for 8 hours, customer identified by email
                value:
                  location_id: "22222222-2222-4222-8222-222222222222"
                  items:
                    - { locker_size_id: "33333333-3333-4333-8333-333333333333", quantity: 1 }
                  duration_minutes: 480
                  customer:
                    email: "customer@example.com"
                    name: "Example Customer"
              explicit_window:
                summary: An explicit window, using start_time and end_time
                value:
                  location_id: "22222222-2222-4222-8222-222222222222"
                  items:
                    - { locker_size_id: "33333333-3333-4333-8333-333333333333", quantity: 2 }
                  start_time: "2026-08-15T19:32:21Z"
                  end_time: "2026-08-16T03:32:21Z"
                  customer:
                    phone: "+971500000000"
      responses:
        "200":
          description: |
            The booking, fresh or replayed.

            `replayed: false` — this request created the booking. Every field
            describes what was just created.

            `replayed: true` — this Idempotency-Key had already been used, and
            **the fields describe the booking's state right now, not the
            original response**. `status`, `total` and `access_code` may all have
            moved on. See the replay note in the API description.
          x-observed: live 2026-08-15 (fresh, bare-path alias, and replay)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateBookingOk" }
              examples:
                fresh:
                  summary: Live capture, sanitised — a new booking
                  value:
                    ok: true
                    replayed: false
                    reference: "CL-EXAMPLE-0001"
                    status: "active"
                    total: 9
                    currency: "AED"
                    access_code: "000000"
                    customer:
                      id: "66666666-6666-4666-8666-666666666666"
                      name: "Example Customer"
                      email: "customer@example.com"
                      phone: null
                replayed:
                  summary: >-
                    Live capture, sanitised — the SAME Idempotency-Key replayed
                    after the booking had been extended and then cancelled. Note
                    `status` and `total` disagree with the original create's
                    response above. This is correct behaviour.
                  value:
                    ok: true
                    replayed: true
                    reference: "CL-EXAMPLE-0001"
                    status: "cancelled"
                    total: 18
                    currency: "AED"
                    access_code: "000000"
                    customer:
                      id: "66666666-6666-4666-8666-666666666666"
                      name: "Example Customer"
                      email: "customer@example.com"
                      phone: null
                pending_payment:
                  summary: >-
                    A `we_collect` partner — the booking awaits the payment
                    gateway, so there is no code yet.
                  value:
                    ok: true
                    replayed: false
                    reference: "CL-EXAMPLE-0002"
                    status: "pending"
                    total: 9
                    currency: "AED"
                    access_code: null
                    customer:
                      id: "66666666-6666-4666-8666-666666666666"
                      name: "Example Customer"
                      email: "customer@example.com"
                      phone: null
        "400":
          description: |
            * `invalid` — missing/blank `Idempotency-Key`, malformed JSON body,
              or a failed shape check (no `location_id`, empty or malformed
              `items`, no `customer.email` and no `customer.phone`, window under
              60 minutes). **All three are reachable unauthenticated.**
            * `invalid` — also returned post-authentication by the booking engine
              for a window the engine cannot price (including the 60–179 minute
              gap, an inactive location, or a size not offered).
            * `invalid_duration` — a multi-day window that is not a whole number
              of 1440-minute blocks.
            * `period_not_allowed` — the window is outside the partner's own
              period policy: sub-24h when the partner is not allowed intraday,
              or over 24h when it is not allowed multiday.
          x-observed: "invalid (malformed body, unauthenticated) observed live 2026-08-15; invalid_duration and period_not_allowed not observed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorCreateBadRequest" }
              examples:
                malformed_body:
                  summary: Live capture — malformed JSON, returned before the key was checked
                  value: { ok: false, reason: "invalid", error: "Malformed JSON body." }
                missing_idempotency_key:
                  summary: Header absent
                  value: { ok: false, reason: "invalid", error: "Idempotency-Key header is required." }
                period_not_allowed:
                  summary: The partner's period policy forbids this window (not observed live)
                  value: { ok: false, reason: "period_not_allowed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            * `capability` — the partner does not hold the inbound direction.
              Returned directly by the edge function after verification.
            * `out_of_scope` — the location is not in this key's scope.
            * `not_permitted` — the partner is not granted `booking.create`.
            * `unauthorized` — **403, not 401**: the booking wrapper found the
              partner not active. Only reachable if the partner is deactivated
              between key verification and the wrapper's own read, since
              verification already requires an active partner. This is the
              one-reason-two-statuses case described in the API description.
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorCreateForbidden" }
              examples:
                capability:
                  value: { ok: false, reason: "capability", error: "Partner lacks the inbound capability." }
                out_of_scope:
                  value: { ok: false, reason: "out_of_scope" }
                unauthorized_403:
                  summary: The partner went inactive mid-request
                  value: { ok: false, reason: "unauthorized" }
        "409":
          description: |
            * `unavailable` — with `cause` (0.285.0): `no_capacity` when no wall
              at the location can satisfy every requested size and quantity for
              the window, `no_price_model` when the resolved wall carries no
              price model (our gap, contact CityLockers), `conflict` when a
              concurrent booking took the compartment first (retry).
            * `in_progress` — this Idempotency-Key is currently being processed
              by another in-flight request. Retry after a short delay; do not
              change the key.
          x-observed: not observed live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorCreateConflict" }
              examples:
                unavailable:
                  value: { ok: false, reason: "unavailable", cause: "no_capacity" }
                unavailable_no_price_model:
                  value: { ok: false, reason: "unavailable", cause: "no_price_model" }
                in_progress:
                  value: { ok: false, reason: "in_progress" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

